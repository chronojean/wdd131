<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review for WDD 131 - Dynamic Web Fundamentals. Rate products, share your experience, and provide installation details.">
    <meta name="author" content="Jean Andrade">
    <title>Product Review Form | WDD 131</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/base.css">

    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <p class="required-note">Fields marked with <abbr title="required">*</abbr> are required.</p>

        <form method="get" action="review.html" class="wf1" aria-label="Product review submission form">

            <!-- ── Product Name ── -->
            <div class="field-row">
                <label for="product">Product Name <abbr title="required">*</abbr></label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
                <div class="field-arrow" id="arrow-product" aria-hidden="true">
                    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="2,20 14,6 14,14 38,14 38,26 14,26 14,34" fill="#b00000"/>
                    </svg>
                </div>
            </div>

            <!-- ── Overall Rating ── -->
            <div class="field-row">
                <fieldset>
                    <legend>Overall Rating <abbr title="required">*</abbr></legend>
                    <div class="rating-container" role="group" aria-label="Overall star rating">
                        <label for="star5"><input type="radio" id="star5" name="rating" value="5" required>
                        <span class="visually-hidden">5 stars</span>&#9733;</label>

                        <label for="star4"><input type="radio" id="star4" name="rating" value="4" required>
                        <span class="visually-hidden">4 stars</span>&#9733;</label>

                        <label for="star3"><input type="radio" id="star3" name="rating" value="3" required>
                        <span class="visually-hidden">3 stars</span>&#9733;</label>

                        <label for="star2"><input type="radio" id="star2" name="rating" value="2" required>
                        <span class="visually-hidden">2 stars</span>&#9733;</label>

                        <label for="star1"><input type="radio" id="star1" name="rating" value="1" required>
                        <span class="visually-hidden">1 star</span>&#9733;</label>
                    </div>
                </fieldset>
                <div class="field-arrow" id="arrow-rating" aria-hidden="true">
                    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="2,20 14,6 14,14 38,14 38,26 14,26 14,34" fill="#b00000"/>
                    </svg>
                </div>
            </div>

            <!-- ── Installation Date ── -->
            <div class="field-row">
                <label for="install-date">Date of Installation <abbr title="required">*</abbr></label>
                <input type="date" id="install-date" name="install-date" required>
                <div class="field-arrow" id="arrow-date" aria-hidden="true">
                    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="2,20 14,6 14,14 38,14 38,26 14,26 14,34" fill="#b00000"/>
                    </svg>
                </div>
            </div>

            <!-- ── Useful Features (optional) ── -->
            <fieldset>
                <legend>Which features did you find useful?</legend>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="feature-durability" name="feature-durability" value="durability">
                        Durability
                    </label>
                    <label>
                        <input type="checkbox" id="feature-ease" name="feature-ease" value="ease-of-use">
                        Ease of Use
                    </label>
                    <label>
                        <input type="checkbox" id="feature-performance" name="feature-performance" value="performance">
                        Performance
                    </label>
                    <label>
                        <input type="checkbox" id="feature-design" name="feature-design" value="design">
                        Design
                    </label>
                </div>
            </fieldset>

            <!-- ── Written Review (optional) ── -->
            <label for="review">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="review" name="review" rows="5" placeholder="Share your experience with this product..."></textarea>

            <!-- ── User Name (optional) ── -->
            <label for="user-name">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="user-name" name="user-name" placeholder="e.g. Jane Doe">

            <button type="submit" id="submit-btn">Post Review</button>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Jean Andrade &ndash; WDD 131</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
