<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank you for submitting your product review - WDD 131 Dynamic Web Fundamentals.">
    <meta name="author" content="Jean Andrade">
    <title>Review Confirmation | WDD 131</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <main>

        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Jean Andrade &ndash; WDD 131</p>
